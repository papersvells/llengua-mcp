name: Live

on:
  schedule:
    # Dilluns a les 06:00 UTC. GitHub pot desactivar les execucions
    # programades després de 60 dies sense activitat al repositori.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Comprova que les fonts responen i que els parsers encara llegeixen
      # l'estructura actual. Una fallada aquí és un avís de canvi al portal.
      # Es reintenta una vegada per absorbir talls de xarxa puntuals.
      - run: python -m pytest tests/test_live.py -q --reruns 1 --reruns-delay 5
        env:
          LLENGUA_LIVE: "1"
          LLENGUA_USER_AGENT: "llengua-mcp/0.1 (CI; https://github.com/papersvells/llengua-mcp)"
