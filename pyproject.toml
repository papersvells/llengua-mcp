[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "llengua-mcp"
version = "0.7.5"
description = "Servidor MCP d'assessorament sobre la llengua catalana"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Projecte llengua" }]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "selectolax>=0.3.21",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-rerunfailures>=16.0",
  "ruff>=0.5",
]

[project.scripts]
llengua-mcp = "llengua_mcp.server:main"
llengua-mcp-fetch-sinonims = "llengua_mcp.fetch_sinonims:main"
llengua-mcp-fetch-engcat = "llengua_mcp.fetch_engcat:main"
llengua-mcp-fetch-direlex = "llengua_mcp.fetch_direlex:main"

[tool.hatch.build.targets.wheel]
packages = ["llengua_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
